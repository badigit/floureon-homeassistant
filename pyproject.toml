[project]
name = "floureon-homeassistant"
version = "2.0.0"
description = "Modern Home Assistant integration for Floureon/Hysen thermostats"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "broadlink==0.19.0",
    "pytest-homeassistant-custom-component==0.13.357",
    "pytest-timeout>=2.3",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
source = ["custom_components/floureon"]

[tool.ruff]
target-version = "py313"
line-length = 88
