[project]
name = "hysen-homeassistant"
version = "3.0.0"
description = "Local Home Assistant integration for Hysen HY02/HY03 Broadlink thermostats"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "broadlink-async==1.2.1",
    "pytest-homeassistant==2026.11.2",
    "ruff>=0.14.0",
    "pytest-timeout>=2.3",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["."]
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
source = ["custom_components/hysen"]

[tool.ruff]
target-version = "py314"
line-length = 88
