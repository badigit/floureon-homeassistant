name: Tests

on:
  push:
    branches: [main, feat/hysen-ha-2026-11-async]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-bootstrap:
    if: github.event_name == 'push' && github.ref_name == 'feat/hysen-ha-2026-11-async'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv lock
      - run: uv sync --group dev --frozen
      - run: uv run ruff check --fix custom_components tests
      - run: uv run ruff format custom_components tests
      - name: Commit refreshed lockfile and formatting
        run: |
          if ! git diff --quiet -- uv.lock custom_components tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock custom_components tests
            git commit -m "chore: refresh uv.lock and format Hysen integration"
            git push origin "HEAD:feat/hysen-ha-2026-11-async"
          fi

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock
      - run: uv sync --group dev --frozen
      - run: uv run pytest --cov=custom_components/floureon --cov-report=term-missing

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv lock
      - run: uv sync --group dev --frozen
      - run: uv run ruff check custom_components tests
      - run: uv run ruff format --check custom_components tests

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
